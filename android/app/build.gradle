plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.eren.prem_kirana_ledger"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.eren.prem_kirana_ledger"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            def keyFilePath = System.getenv("KEYSTORE_PATH") ?: (findProperty("RELEASE_STORE_FILE") ?: keystoreProperties['storeFile'])
            def storePasswordValue = System.getenv("KEYSTORE_PASSWORD") ?: (findProperty("RELEASE_STORE_PASSWORD") ?: keystoreProperties['storePassword'])
            def keyAliasValue = System.getenv("KEY_ALIAS") ?: (findProperty("RELEASE_KEY_ALIAS") ?: keystoreProperties['keyAlias'])
            def keyPasswordValue = System.getenv("KEY_PASSWORD") ?: (findProperty("RELEASE_KEY_PASSWORD") ?: keystoreProperties['keyPassword'])

            if (keyFilePath) {
                def keyFile = new File(keyFilePath)
                if (!keyFile.isAbsolute()) {
                    if (rootProject.file(keyFilePath).exists()) {
                        keyFile = rootProject.file(keyFilePath)
                    } else if (new File(rootProject.rootDir.parentFile, keyFilePath).exists()) {
                        keyFile = new File(rootProject.rootDir.parentFile, keyFilePath)
                    } else if (file(keyFilePath).exists()) {
                        keyFile = file(keyFilePath)
                    }
                }
                storeFile keyFile
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}
